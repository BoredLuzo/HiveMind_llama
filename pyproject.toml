[project]
name = "hivemind-llama"
version = "1.0.7"
description = "HiveMind is a local, privacy-first AI assistant and multi-agent coding platform powered by llama.cpp."
readme = "README.md"
authors = [
    { name = "BoredLuzo", email = "NicolasKb@t-online.de" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pywin32>=306 ; sys_platform == 'win32'",
    "rich>=13.7",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45",
]
notifications = [
    "winotify>=0.1.5 ; sys_platform == 'win32'",
]
recommended=[
    "trafilatura>=1.12",
    "tree-sitter-language-pack>=0.2",
    "pyyaml>=6.0",
]

