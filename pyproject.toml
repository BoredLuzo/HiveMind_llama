[project]
name = "hivemind-llama"
version = "1.4.6"
description = "HiveMind is a local, privacy-first AI assistant and multi-agent coding platform powered by llama.cpp."
readme = "README.md"
authors = [
    { name = "BoredLuzo" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    # explicit floor: an old pydantic-core next to a new pydantic raises
    # "cannot import name 'ArgsKwargs'" at import time
    "pydantic>=2.11",
    "httpx>=0.27",
    "pywin32>=306 ; sys_platform == 'win32'",
    "rich>=13.7",
    "uvicorn>=0.30",
    "watchfiles>=0.21",
    # Windows Credential Manager for the optional Telegram gateway (P8
    # supervisor spawns the gateway from this venv - vault access).
    "keyring>=25 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.optional-dependencies]
voice = [
    "soundfile>=0.13",
    "numpy>=2.0",
]
browser = [
    "playwright>=1.45",
]
notifications = [
    "winotify>=0.1.5 ; sys_platform == 'win32'",
]
recommended=[
    "trafilatura>=1.12",
    "tree-sitter-language-pack>=0.2",
    "pyyaml>=6.0",
]

