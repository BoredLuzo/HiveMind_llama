name: windows-full

# FULL-WINDOWS-GATE (2026-11-04): the complete 307-suite gate needs fixtures
# and tools that exist on a developer box, not on a clean hosted runner
# (model configs, rust-analyzer, local model files). It was previously part
# of linux-core.yml and failed on every push, which turned the Linux workflow
# red and spammed failure mail. Keep it as an explicit/manual gate; the push
# gate is linux-core.yml (core + pyright types).
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC - visible without blocking every push.
    - cron: "0 4 * * 1"

jobs:
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install deps
        run: |
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest ruff
      - name: Full regression gate
        # 2026-11-07: a hosted runner has two cores - six workers flake
        # (WinError 10053 on the socket suites). --ci-subset drops the
        # three suites whose fixtures only exist on a developer box.
        run: python tests/run_regressions.py --ci-subset --jobs 2
