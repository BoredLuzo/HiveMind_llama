name: windows-full

# FULL-WINDOWS-GATE (2026-11-04): the complete 343-suite gate needs fixtures
# and tools that exist on a developer box, not on a clean hosted runner
# (model configs, rust-analyzer, local model files). It was previously part
# of linux-core.yml and failed on every push, which turned the Linux workflow
# red and spammed failure mail. Keep it as an explicit/manual gate; the push
# gate is linux-core.yml (core + pyright types).
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC - visible without blocking every push.
    - cron: "0 4 * * 1"

jobs:
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # SCHEDULED-BRANCH (deep audit 2026-11-07): scheduled workflows run
          # the DEFAULT branch's copy of this file. Without this ref the
          # weekly gate tested a stale main snapshot with the old 6-worker
          # config while dev carried the fixes. This line takes effect once
          # this file is merged to main; until then the Monday run still uses
          # main's copy - merge before relying on it as the dev gate.
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pyright language server
        # test_lsp_real_pyright otherwise skips with exit 0 on the hosted
        # runner (deep audit 2026-11-08) - real LSP coverage needs the binary.
        run: npm install -g pyright
      - uses: astral-sh/setup-uv@v5
      - name: Dependency lock is current
        # The updater installs with `uv sync --frozen`; a stale uv.lock would
        # ship a different dependency set than the one the tree was tested
        # with (B10, 2026-11-07).
        run: uv lock --check
      - name: Install the frozen lock set (what users actually get)
        # LOCKED-INSTALL (deep audit 2026-11-07): the old pip step resolved
        # newest-of-the-day from requirements floors; the exact versions
        # install.bat/updater.py install were never exercised in CI.
        run: uv sync --frozen
      - name: Full regression gate
        # 2026-11-07: a hosted runner has two cores - six workers flake
        # (WinError 10053 on the socket suites). --ci-subset drops the
        # three suites whose fixtures only exist on a developer box.
        run: uv run --frozen --no-sync python tests/run_regressions.py --ci-subset --jobs 2
